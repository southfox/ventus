name: PR

on:
  pull_request:
    branches: [dev, master]
    paths-ignore:
      - "Website/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ios-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/swift-tests.yml
    permissions:
      contents: read
      pull-requests: write

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: iOS
            scheme: VentusIOS
            destination: generic/platform=iOS Simulator
          - platform: macOS
            scheme: VentusMacOS
            destination: generic/platform=macOS
          - platform: tvOS
            scheme: VentusTVOS
            destination: generic/platform=tvOS Simulator
          - platform: visionOS
            scheme: VentusVisionOS
            destination: generic/platform=visionOS Simulator
          - platform: watchOS
            scheme: VentusWatchOnly
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('App/Ventus.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-app-${{ runner.os }}-

      - name: Build ${{ matrix.scheme }}
        env:
          SCHEME: ${{ matrix.scheme }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/Ventus.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
